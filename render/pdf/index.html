<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>PDF Viewer</title>
  <link rel="stylesheet" href="../assets/pdf/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="space">
      <div id="language">
        <button id="ru">RU</button>
        <button id="en">EN</button>
        <button id="cz">CZ</button>
      </div>
      <!-- <button id="toggleLens">Translator: OFF</button> -->
      <input type="file" id="filePick" accept="application/pdf"/>
    </div>
      <div id="next"><button id ="nextButton">Translate &rArr;</button></div>
  </div>

  <div id="viewer"></div>
  <div id="status"></div>
  <script type="module" src="../../node_modules/pdfjs-dist/build/pdf.min.mjs"></script>
  <script type="module" src="./render.js"></script>
</body>
</html>
